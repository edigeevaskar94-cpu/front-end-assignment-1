<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YachtRent Astana - Booking</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header id="main-header">
        <nav class="navigation">
            <a href="index.html" class="logo">
                Yacht<span>Rent</span>
            </a>

            <div class="nav-menu">
                <a href="index.html">Home</a>
                <a href="cars.html">Yachts</a>
                <a href="about.html">About</a>
                <a href="services.html">Services</a>
                <a href="booking.html">Booking</a>
                <a href="contacts.html">Contacts</a>
            </div>
        </nav>
    </header>


    <main>

        <section class="booking-intro">
            <h1>Book Your Yacht</h1>

            <p>
                Fill out the form below to reserve a luxury yacht. Our manager will 
                contact you shortly to confirm your booking details.
            </p>
        </section>


        <section class="booking-section">

            <div class="form-container">
                <form action="#" method="post" class="booking-form">

                    <div class="form-group">
                        <label for="yacht-select">Select Yacht *</label>
                        <select id="yacht-select" name="yacht" required>
                            <option value="">-- Choose a yacht --</option>
                            <option value="ocean-pearl">Ocean Pearl (120,000 ₸ / day)</option>
                            <option value="sea-breeze">Sea Breeze (150,000 ₸ / day)</option>
                            <option value="royal-wave">Royal Wave (200,000 ₸ / day)</option>
                            <option value="blue-horizon">Blue Horizon (170,000 ₸ / day)</option>
                            <option value="silver-wave">Silver Wave (145,000 ₸ / day)</option>
                            <option value="sunset-dream">Sunset Dream (130,000 ₸ / day)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="full-name">Full Name *</label>
                        <input type="text" id="full-name" name="name" placeholder="John Doe" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number *</label>
                        <input type="tel" id="phone" name="phone" placeholder="+7 (700) 000-00-00" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="example@mail.com">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="pickup-date">Charter Start Date *</label>
                            <input type="date" id="pickup-date" name="pickup_date" required>
                        </div>

                        <div class="form-group">
                            <label for="return-date">Charter End Date *</label>
                            <input type="date" id="return-date" name="return_date" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="notes">Additional Request</label>
                        <textarea id="notes" name="notes" rows="4" placeholder="Catering services, captain requirements, special event setup, etc."></textarea>
                    </div>

                    <button type="submit" class="button form-button">Submit Request</button>

                </form>
            </div>

        </section>

    </main>


    <footer>
        <p>YachtRent Astana</p>
        <p>Team Members: Askar, Ermek, Nurislam</p>
    </footer>

</body>
</html>
